version: 2

project_name: aicm

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github

homebrew_casks:
  - name: aicm
    repository:
      owner: sefatanam
      name: homebrew-tap
      # Pushed over SSH with a write deploy key scoped to the tap repo.
      git:
        url: git@github.com:sefatanam/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    homepage: https://github.com/sefatanam/aicm
    description: AI commit messages from your staged changes
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/aicm"]
